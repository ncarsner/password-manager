[project]
name = "password-manager"
version = "0.1.0"
description = "A secure password manager application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Flask>=2.1.2",
    "Flask-Cors>=3.0.10",
    "cryptography>=36.0.1",
    "python-dotenv>=0.19.2"
]

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "pytest-cov>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --cov=backend/src --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
